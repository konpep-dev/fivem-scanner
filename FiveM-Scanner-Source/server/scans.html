<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scans | </async> Scanner</title>
  <script src="security.js"></script>
  <script src="notifications.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@500;700&family=JetBrains+Mono:wght@400&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg-dark: #050505;
      --bg-panel: #0a0a0a;
      --surface-glass: rgba(20, 20, 20, 0.6);
      --surface-glass-hover: rgba(30, 30, 30, 0.7);
      --border-glass: rgba(255, 255, 255, 0.08);
      --text-primary: #ffffff;
      --text-secondary: #a1a1aa;
      --primary-glow: rgba(88, 101, 242, 0.5);
      --accent-color: #5865F2;
      --accent-hover: #4752C4;
      --success: #10B981;
      --danger: #EF4444;
      --warning: #F59E0B;
      --font-main: 'Inter', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-primary);
      font-family: var(--font-main);
      overflow-x: hidden;
      background-image:
        radial-gradient(circle at 15% 50%, rgba(88, 101, 242, 0.08), transparent 25%),
        radial-gradient(circle at 85% 30%, rgba(16, 185, 129, 0.05), transparent 25%);
      min-height: 100vh;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #444;
    }

    /* Layout */
    #app-container {
      display: flex;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    /* Sidebar - Glassy & Sleek */
    .sidebar {
      width: 260px;
      background: rgba(10, 10, 10, 0.8);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-right: 1px solid var(--border-glass);
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex-shrink: 0;
      z-index: 50;
    }

    .logo {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.8rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 3rem;
      text-shadow: 0 0 20px rgba(88, 101, 242, 0.5);
      letter-spacing: 1px;
    }

    .logo span {
      color: var(--accent-color);
    }

    .nav-links {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .nav-link {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.85rem 1rem;
      border-radius: 12px;
      text-decoration: none;
      color: var(--text-secondary);
      font-weight: 500;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      border: 1px solid transparent;
    }

    .nav-link:hover {
      background: rgba(255, 255, 255, 0.03);
      color: #fff;
      transform: translateX(4px);
    }

    .nav-link.active {
      background: rgba(88, 101, 242, 0.1);
      color: #fff;
      border-color: rgba(88, 101, 242, 0.2);
      box-shadow: 0 0 15px rgba(88, 101, 242, 0.1);
    }

    .nav-link svg {
      width: 20px;
      height: 20px;
      opacity: 0.8;
    }

    .nav-link.active svg {
      opacity: 1;
      color: var(--accent-color);
    }

    /* Main Content */
    .dashboard {
      flex-grow: 1;
      overflow-y: auto;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2rem 3rem;
      position: sticky;
      top: 0;
      z-index: 40;
      background: linear-gradient(to bottom, var(--bg-dark) 0%, rgba(5, 5, 5, 0) 100%);
      backdrop-filter: blur(5px);
    }

    .dashboard-header h1 {
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(to right, #fff, #a1a1aa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    #header-actions {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    /* Buttons */
    .primary-btn {
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(88, 101, 242, 0.3);
    }

    .primary-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(88, 101, 242, 0.4);
      background: var(--accent-hover);
    }

    .primary-btn:disabled {
      background: #333;
      color: #666;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    .secondary-btn {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-secondary);
      border: 1px solid var(--border-glass);
      padding: 0.75rem 1.5rem;
      border-radius: 10px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
    }

    .secondary-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border-color: rgba(255, 255, 255, 0.2);
    }

    .game-select-dropdown {
      font-family: var(--font-main);
      background: rgba(20, 20, 20, 0.8);
      color: #fff;
      border: 1px solid var(--border-glass);
      padding: 0.75rem 1rem;
      border-radius: 10px;
      cursor: pointer;
      outline: none;
    }

    .dashboard-content {
      padding: 0 3rem 3rem 3rem;
    }

    /* Scans List Card */
    .card {
      background: var(--surface-glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-glass);
      border-radius: 16px;
      padding: 1.5rem;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .scans-list-card {
      padding: 0;
    }

    #no-scans-message {
      padding: 3rem;
      text-align: center;
      color: var(--text-secondary);
    }

    .scan-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.25rem 2rem;
      border-bottom: 1px solid var(--border-glass);
      transition: all 0.2s ease;
    }

    .scan-item:last-child {
      border-bottom: none;
    }

    .scan-item:hover {
      background: rgba(255, 255, 255, 0.02);
    }

    .scan-info {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .scan-pin {
      font-family: var(--font-mono);
      font-weight: 600;
      color: #fff;
      font-size: 1.1rem;
    }

    .scan-game {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--accent-color);
      background: rgba(88, 101, 242, 0.1);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      text-transform: uppercase;
      width: fit-content;
      margin-top: 0.25rem;
    }

    .scan-url {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: color 0.2s;
    }

    .scan-url:hover {
      color: var(--accent-color);
    }

    .scan-time {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-top: 0.25rem;
    }

    .status-badge {
      padding: 0.35rem 0.85rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .status-badge.pending {
      background: rgba(245, 158, 11, 0.1);
      color: var(--warning);
      border: 1px solid rgba(245, 158, 11, 0.2);
    }

    .status-badge.success {
      background: rgba(16, 185, 129, 0.1);
      color: var(--success);
      border: 1px solid rgba(16, 185, 129, 0.2);
    }

    .status-badge.error {
      background: rgba(239, 68, 68, 0.1);
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.2);
    }

    .status-scanning {
      color: var(--accent-color);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 500;
    }

    .loader {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(88, 101, 242, 0.3);
      border-top-color: var(--accent-color);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .scan-actions {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .scan-results-link {
      color: var(--accent-color);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.9rem;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      background: rgba(88, 101, 242, 0.1);
      transition: all 0.2s;
    }

    .scan-results-link:hover {
      background: rgba(88, 101, 242, 0.2);
    }

    .delete-scan-btn {
      background: transparent;
      border: 1px solid var(--border-glass);
      color: var(--text-secondary);
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .delete-scan-btn:hover {
      border-color: var(--danger);
      color: var(--danger);
      background: rgba(239, 68, 68, 0.1);
    }

    /* Download Notification */
    .download-notification {
      position: fixed;
      top: 2rem;
      right: 2rem;
      background: rgba(15, 15, 15, 0.95);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-glass);
      border-radius: 16px;
      padding: 1.5rem;
      width: 400px;
      z-index: 1000;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      animation: slideIn 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    @keyframes slideIn {
      from {
        transform: translateX(100%);
        opacity: 0;
      }

      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    .notification-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .notification-header h3 {
      font-size: 1.1rem;
      font-weight: 600;
      color: #fff;
      flex-grow: 1;
    }

    .close-notification {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 1.2rem;
    }

    .notification-content p {
      color: var(--text-secondary);
      margin-bottom: 1.5rem;
      line-height: 1.5;
      font-size: 0.9rem;
    }

    .notification-content strong {
      color: #fff;
      font-family: var(--font-mono);
      background: rgba(255, 255, 255, 0.1);
      padding: 0.2rem 0.4rem;
      border-radius: 4px;
    }

    .notification-actions {
      display: flex;
      gap: 0.75rem;
    }

    .download-btn {
      flex: 1;
      background: var(--accent-color);
      color: #fff;
      text-decoration: none;
      padding: 0.75rem;
      border-radius: 8px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .download-btn:hover {
      background: var(--accent-hover);
    }

    .copy-url-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-glass);
      color: var(--text-secondary);
      padding: 0.75rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .copy-url-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    .hidden {
      display: none !important;
    }

    /* Responsive */
    @media (max-width: 768px) {
      #app-container {
        flex-direction: column;
        height: auto;
        overflow: auto;
      }

      .sidebar {
        width: 100%;
        height: auto;
        padding: 1rem;
        flex-direction: row;
        align-items: center;
        position: sticky;
        top: 0;
      }

      .nav-links {
        flex-direction: row;
        overflow-x: auto;
      }

      .dashboard-content {
        padding: 1.5rem;
      }

      .dashboard-header {
        padding: 1.5rem;
        flex-direction: column;
        gap: 1rem;
        align-items: flex-start;
      }

      .scan-item {
        flex-direction: column;
        align-items: flex-start;
        gap: 1rem;
      }

      .scan-actions {
        width: 100%;
        justify-content: space-between;
      }
    }
  </style>
</head>

    <main class="dashboard">
      <header class="dashboard-header">
        <h1 id="dashboard-title">My Scans</h1>
        <div id="header-actions">
          <!-- JS will populate this -->
        </div>
      </header>
      <section class="dashboard-content">
        <div class="card scans-list-card">
          <div id="scans-list">
            <!-- Scan items will be dynamically inserted here -->
          </div>

        </div>

  <script type="module">
    let currentUser = null;
    let allScans = [];
    const scansList = document.getElementById('scans-list');
    const noScansMessage = document.getElementById('no-scans-message');

    function formatDate(isoString) {
      if (!isoString) return 'N/A';
      try {
        const date = new Date(isoString);
        return date.toLocaleString('sv-SE');
      } catch (e) {
        return isoString;
      }
    }

    function applyCachedAuth() {
      try {
        const cachedUser = sessionStorage.getItem('currentUser');
        if (cachedUser) {
          const user = JSON.parse(cachedUser);
          if (user.role === 'admin') {
            document.getElementById('admin-nav-link-container').classList.remove('hidden');
          }
          if (user.is_enterprise_admin) {
            document.getElementById('enterprise-nav-link-container').classList.remove('hidden');
          }
        }
      } catch (e) {
        console.warn('Could not apply cached auth state.', e);
        sessionStorage.removeItem('currentUser');
      }
    }

    async function checkAuth() {
      try {
        const response = await fetch('/api/user');
        if (!response.ok) {
          window.location.href = '/index.html';
          return null;
        }
        const userData = await response.json();
        sessionStorage.setItem('currentUser', JSON.stringify(userData));
        if (userData.is_banned || !userData.has_license) {
          window.location.href = '/unlicensed.html';
          return null;
        }
        currentUser = userData;
        return userData;
      } catch (error) {
        console.error("Auth check failed:", error);
        window.location.href = '/index.html';
        return null;
      }
    }

    function setupSharedLayout(user) {
      if (user && user.role === 'admin') {
        document.getElementById('admin-nav-link-container').classList.remove('hidden');
      }
      if (user && user.is_enterprise_admin) {
        document.getElementById('enterprise-nav-link-container').classList.remove('hidden');
      }
      document.getElementById('logout-btn').addEventListener('click', e => {
        e.preventDefault();
        window.location.href = '/logout';
      });
    }

    function renderScans() {
      if (!scansList || !noScansMessage) return;

      const scansToShow = allScans;

      if (scansToShow.length === 0) {
        noScansMessage.style.display = 'block';
        scansList.innerHTML = '';
      } else {
        noScansMessage.style.display = 'none';
        scansList.innerHTML = scansToShow.map(scan => {
          let statusHTML = '';
          let actionHTML = '';

          switch (scan.status) {
            case 'Pending':
              statusHTML = `<span class="status-badge pending">Pending Submission</span>`;
              actionHTML = `<span class="scan-action-text">Waiting for scanner...</span>`;
              break;
            case 'Scanning':
              statusHTML = `<div class="status-scanning"><div class="loader"></div>Scanning...</div>`;
              actionHTML = `<span class="scan-action-text">Scan in progress...</span>`;
              break;
            case 'Cheats Detected':
              statusHTML = `<span class="status-badge error">Threats Found</span>`;
              if (scan.critical_count > 0) {
                actionHTML = `<a href="/report?id=${scan.id}" class="scan-results-link">View ${scan.critical_count} Critical threat${scan.critical_count !== 1 ? 's' : ''}</a>`;
              } else {
                actionHTML = `<a href="/report?id=${scan.id}" class="scan-results-link">View Report</a>`;
              }
              break;
            case 'No threats found':
              statusHTML = `<span class="status-badge success">Clean</span>`;
              actionHTML = `<a href="/report?id=${scan.id}" class="scan-results-link">View scan report</a>`;
              break;
            default:
              statusHTML = `<span class="status-badge">${scan.status}</span>`;
              actionHTML = `<span class="scan-action-text">Status: ${scan.status}</span>`;
              break;
          }

          let deleteButton = '';
          if (currentUser && currentUser.role === 'admin') {
            deleteButton = `<button class="delete-scan-btn" data-scan-id="${scan.id}" title="Delete PIN">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18m-2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M10 11v6m4-6v6"/></svg>
                    </button>`;
          }

          return `
                    <div class="scan-item" id="scan-item-${scan.id}">
                        <div class="scan-info">
                            <span class="scan-pin">PIN: ${scan.pin}</span>
                            <span class="scan-game">${scan.game}</span>
                            <a href="#" class="scan-url" data-url="${scan.url}">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="display: inline; margin-right: 4px;"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.72" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.72-1.72" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                                ${scan.url}
                            </a>
                            <span class="scan-time">${formatDate(scan.timestamp)}</span>
                        </div>
                        <div class="scan-status">
                            ${statusHTML}
                        </div>
                        <div class="scan-actions">
                            ${actionHTML}
                            ${deleteButton}
                        </div>
                    </div>
                `;
        }).join('');
      }
    }

    async function fetchScans(userId = null) {
      try {
        const apiUrl = userId ? `/api/scans?user_id=${userId}` : '/api/scans';
        const response = await fetch(apiUrl);
        if (!response.ok) {
          if (response.status === 404 && userId) {
            throw new Error('User not found.');
          }
          throw new Error('Failed to fetch scans from server.');
        }
        allScans = await response.json();
        renderScans();
      } catch (error) {
        console.error(error);
        scansList.innerHTML = `<p style="color: var(--accent-negative); padding: 1rem;">Error loading scans: ${error.message}</p>`;
      }
    }

    async function generatePin() {
      const headerActionBtn = document.getElementById('header-action-btn');
      headerActionBtn.disabled = true;
      headerActionBtn.textContent = 'Generating...';
      try {
        const selectedGame = document.getElementById('game-select').value;
        const response = await fetch('/api/scans', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ game: selectedGame })
        });
        if (!response.ok) throw new Error('Failed to generate new PIN.');
        const newScan = await response.json();
        showDownloadNotification(newScan.pin);
        await fetchScans(); // This will re-render the list with the new PIN
      } catch (error) {
        console.error(error);
        alert('Could not generate a new PIN. Please try again.');
      } finally {
        headerActionBtn.disabled = false;
        headerActionBtn.textContent = 'Generate New PIN';
      }
    }

    function showDownloadNotification(pin) {
      const existingNotification = document.querySelector('.download-notification');
      if (existingNotification) existingNotification.remove();

      const downloadUrl = `${window.location.origin}/api/download-scanner/${pin}`;
      const notification = document.createElement('div');
      notification.className = 'download-notification';
      notification.innerHTML = `
            <div class="notification-header">
                <h3>Scanner PIN Generated!</h3>
                <button class="close-notification">&times;</button>
            </div>
            <div class="notification-content">
                <p>Download the scanner and run it, then provide PIN <strong>${pin}</strong> to submit your results.</p>
                <div class="notification-actions">
                    <a href="${downloadUrl}" class="download-btn">
                      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                      Download Scanner
                    </a>
                    <button class="copy-url-btn" data-url="${downloadUrl}">
                        Copy Link
                    </button>
                </div>
            </div>
        `;
      document.body.appendChild(notification);

      // Event listeners for the new notification
      notification.querySelector('.close-notification').addEventListener('click', () => notification.remove());
      notification.querySelector('.copy-url-btn').addEventListener('click', function () {
        copyToClipboard(this.dataset.url, this);
      });

      setTimeout(() => { if (notification.parentNode) notification.remove() }, 20000);
    }

    function copyToClipboard(text, btn) {
      navigator.clipboard.writeText(text).then(() => {
        const originalText = btn.innerHTML;
        btn.innerHTML = 'Copied!';
        setTimeout(() => { btn.innerHTML = originalText; }, 2000);
      }).catch(err => console.error('Failed to copy: ', err));
    }

    async function deleteScan(scanId) {
      const scan = allScans.find(s => s.id === scanId);
      let confirmMessage = `Are you sure you want to delete PIN ${scan ? scan.pin : ''}? This action cannot be undone.`;
      if (scan && scan.status !== 'Pending') {
        confirmMessage = `This scan has results. Are you sure you want to delete PIN ${scan.pin} and its report? This cannot be undone.`
      }

      if (!confirm(confirmMessage)) return;

      try {
        const response = await fetch(`/api/scans/${scanId}`, { method: 'DELETE' });
        if (!response.ok) throw new Error('Failed to delete scan.');

        const scanItemEl = document.getElementById(`scan-item-${scanId}`);
        if (scanItemEl) scanItemEl.remove();

        allScans = allScans.filter(s => s.id !== scanId);
        if (allScans.length === 0) {
          noScansMessage.style.display = 'block';
        }

      } catch (error) {
        console.error('Error deleting scan:', error);
        alert(`Failed to delete PIN: ${error.message}`);
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      applyCachedAuth();
      const user = await checkAuth();
      if (user) {
        setupSharedLayout(user);
        const params = new URLSearchParams(window.location.search);
        const viewUserId = params.get('user_id');
        const headerActions = document.getElementById('header-actions');

        if (viewUserId && user.role === 'admin') {
          document.getElementById('dashboard-title').textContent = `Scans for User: ${viewUserId}`;
          headerActions.innerHTML = `
                    <button id="refresh-btn" class="secondary-btn">Refresh</button>
                    <a href="/admin.html" class="secondary-btn" style="text-decoration: none;">Back to Admin</a>
                `;
          document.getElementById('refresh-btn').addEventListener('click', () => fetchScans(viewUserId));
          fetchScans(viewUserId);
        } else {
          headerActions.innerHTML = `
                    <select id="game-select" class="game-select-dropdown">
                        <option value="fivem">For FiveM</option>
                        <option value="dayz" disabled>For DayZ (Soon)</option>
                        <option value="minecraft" disabled>For Minecraft (Soon)</option>
                    </select>
                    <button class="primary-btn" id="header-action-btn">Generate New PIN</button>
                    <button id="refresh-btn" class="secondary-btn">Refresh</button>
                `;

          const savedGame = localStorage.getItem('selectedGame');
          const gameSelect = document.getElementById('game-select');
          if (savedGame && gameSelect) {
            if (gameSelect.querySelector(`option[value="${savedGame}"]:not([disabled])`)) {
              gameSelect.value = savedGame;
            }
          }

          fetchScans();
          document.getElementById('header-action-btn').addEventListener('click', generatePin);
          document.getElementById('refresh-btn').addEventListener('click', () => fetchScans());
        }

        document.body.addEventListener('click', (e) => {
          const deleteBtn = e.target.closest('.delete-scan-btn');
          if (deleteBtn) deleteScan(parseInt(deleteBtn.dataset.scanId, 10));
        });
      }
    });
  </script>
</body>

</html>
