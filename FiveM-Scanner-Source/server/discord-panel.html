<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discord Management | </async> Scanner</title>
  <script src="security.js"></script>
  <script src="notifications.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --background-color: #0A0A0A;
      --sidebar-bg: #000000;
      --surface-color: #141414;
      --border-color: #2A2A2A;
      --text-primary: #FFFFFF;
      --text-secondary: #A0A0A0;
      --accent-positive: #10B981;
      --accent-negative: #EF4444;
      --accent-warning: #F59E0B;
      --discord-blurple: #5865F2;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; width: 100%; }
    body {
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      background-color: var(--background-color);
      overflow: hidden;
    }
    .hidden { display: none !important; }
    
    /* Custom Scrollbars */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--background-color); }
    ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--discord-blurple); }
    
    /* Layout */
    .discord-container { display: flex; height: 100vh; }
    
    /* Sidebar - Channels */
    .discord-sidebar { width: 240px; background-color: var(--sidebar-bg); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; }
    .discord-header { padding: 1rem; border-bottom: 1px solid var(--border-color); font-weight: 600; font-size: 1.1rem; }
    .channel-list { flex-grow: 1; overflow-y: auto; padding: 0.5rem; }
    .channel-category { color: var(--text-secondary); font-size: 0.75rem; font-weight: 600; text-transform: uppercase; padding: 0.5rem 0.75rem; margin-top: 1rem; }
    .channel-item { padding: 0.5rem 0.75rem; margin: 2px 0; border-radius: 4px; cursor: pointer; display: flex; align-items: center; gap: 0.5rem; transition: background 0.1s; }
    .channel-item:hover { background-color: var(--surface-color); }
    .channel-item.active { background-color: var(--discord-blurple); color: white; }
    .channel-icon { width: 16px; height: 16px; color: var(--text-secondary); }
    
    /* Main Content */
    .discord-main { flex-grow: 1; display: flex; flex-direction: column; }
    .chat-header { padding: 1rem 1.5rem; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
    .chat-header h2 { font-size: 1.25rem; display: flex; align-items: center; gap: 0.5rem; }
    .messages-container { flex-grow: 1; overflow-y: auto; padding: 1rem; }
    .message { display: flex; gap: 1rem; padding: 0.75rem 1rem; border-radius: 4px; margin-bottom: 0.25rem; transition: background 0.1s; }
    .message:hover { background-color: rgba(255,255,255,0.03); }
    .message-avatar { width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0; transition: transform 0.2s; }
    .message:hover .message-avatar { transform: scale(1.1); }
    .message-content { flex-grow: 1; }
    .message-header { display: flex; align-items: baseline; gap: 0.75rem; margin-bottom: 0.25rem; }
    .message-author { font-weight: 600; cursor: pointer; }
    .message-author:hover { text-decoration: underline; }
    .message-timestamp { font-size: 0.75rem; color: var(--text-secondary); }
    .message-text { color: var(--text-primary); word-wrap: break-word; line-height: 1.5; }
    .bot-badge { background: var(--discord-blurple); padding: 2px 6px; border-radius: 3px; font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    
    /* Message Input */
    .message-input-container { padding: 1rem; border-top: 1px solid var(--border-color); }
    .message-input { width: 100%; background: var(--surface-color); border: 1px solid var(--border-color); color: var(--text-primary); padding: 0.75rem; border-radius: 8px; font-family: inherit; resize: none; }
    .message-input:focus { outline: none; border-color: var(--discord-blurple); }
    
    /* Right Sidebar - Members */
    .members-sidebar { width: 240px; background-color: var(--sidebar-bg); border-left: 1px solid var(--border-color); overflow-y: auto; }
    .members-header { padding: 1rem; border-bottom: 1px solid var(--border-color); font-weight: 600; }
    .members-list { padding: 0.5rem; }
    .member-item { padding: 0.5rem 0.75rem; margin: 2px 0; border-radius: 4px; display: flex; align-items: center; gap: 0.75rem; cursor: pointer; transition: all 0.2s; position: relative; }
    .member-item:hover { background-color: var(--surface-color); transform: translateX(4px); }
    .member-avatar { width: 32px; height: 32px; border-radius: 50%; position: relative; }
    .member-avatar-img { width: 100%; height: 100%; border-radius: 50%; }
    .member-name { flex-grow: 1; font-size: 0.9rem; }
    .member-status { width: 10px; height: 10px; border-radius: 50%; position: absolute; bottom: -2px; right: -2px; border: 2px solid var(--sidebar-bg); }
    .status-online { background-color: var(--accent-positive); box-shadow: 0 0 8px var(--accent-positive); }
    .status-idle { background-color: var(--accent-warning); }
    .status-dnd { background-color: var(--accent-negative); }
    .status-offline { background-color: var(--text-secondary); }
    
    /* User Modal */
    .user-modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); z-index: 1000; display: flex; align-items: center; justify-content: center; }
    .user-modal { background: var(--surface-color); border: 1px solid var(--border-color); border-radius: 12px; width: 90%; max-width: 500px; overflow: hidden; }
    .user-modal-header { background: var(--discord-blurple); padding: 1.5rem; text-align: center; position: relative; }
    .user-modal-close { position: absolute; top: 1rem; right: 1rem; background: rgba(0,0,0,0.3); border: none; color: white; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
    .user-modal-close:hover { background: rgba(0,0,0,0.5); }
    .user-modal-avatar { width: 80px; height: 80px; border-radius: 50%; border: 4px solid rgba(255,255,255,0.2); margin: 0 auto 1rem; }
    .user-modal-username { font-size: 1.5rem; font-weight: 700; color: white; }
    .user-modal-discriminator { font-size: 1rem; color: rgba(255,255,255,0.7); }
    .user-modal-body { padding: 1.5rem; }
    .user-info-section { margin-bottom: 1.5rem; }
    .user-info-label { font-size: 0.75rem; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 0.5rem; }
    .user-info-value { color: var(--text-primary); }
    .role-list { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .role-badge { padding: 0.25rem 0.75rem; border-radius: 12px; font-size: 0.85rem; font-weight: 600; display: inline-flex; align-items: center; gap: 0.5rem; }
    .role-color { width: 12px; height: 12px; border-radius: 50%; }
    .user-actions { display: flex; gap: 0.5rem; margin-top: 1.5rem; }
    .user-action-btn { flex: 1; padding: 0.75rem; border-radius: 6px; border: none; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .user-action-btn.kick { background: var(--accent-warning); color: white; }
    .user-action-btn.kick:hover { background: #D97706; }
    .user-action-btn.ban { background: var(--accent-negative); color: white; }
    .user-action-btn.ban:hover { background: #DC2626; }
    
    /* Buttons */
    .btn { padding: 0.5rem 1rem; border-radius: 6px; border: none; cursor: pointer; font-weight: 600; transition: all 0.2s; }
    .btn-primary { background-color: var(--discord-blurple); color: white; }
    .btn-primary:hover { background-color: #4752C4; }
    .btn-danger { background-color: var(--accent-negative); color: white; }
    .btn-danger:hover { background-color: #DC2626; }
    
    /* Loading */
    .loader { width: 24px; height: 24px; border: 3px solid var(--border-color); border-top-color: var(--discord-blurple); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 1rem; color: var(--text-secondary); }
  </style>
</head>
<body>
  <div class="discord-container">
    <!-- Left Sidebar - Channels -->
    <div class="discord-sidebar">
      <div class="discord-header">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <span id="guild-name">Loading...</span>
          <a href="/admin" style="color: var(--text-secondary); text-decoration: none; font-size: 1.2rem;" title="Back to Admin">←</a>
        </div>
      </div>
      <div class="channel-list" id="channel-list">
        <div class="loading-container">
          <div class="loader"></div>
          <p>Loading channels...</p>
        </div>
      </div>
    </div>
    
    <!-- Main Content - Messages -->
    <div class="discord-main">
      <div class="chat-header">
        <h2 id="channel-name">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
          Select a channel
        </h2>
        <button id="refresh-messages-btn" class="btn btn-primary" style="display: none;">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: inline; vertical-align: middle;"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
        </button>
      </div>
      <div class="messages-container" id="messages-container">
        <div class="loading-container">
          <p style="color: var(--text-secondary);">Select a channel to view messages</p>
        </div>
      </div>
      <div class="message-input-container" id="message-input-container" style="display: none;">
        <textarea id="message-input" class="message-input" placeholder="Type a message..." rows="2"></textarea>
        <div style="display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 0.5rem;">
          <button id="send-message-btn" class="btn btn-primary">Send Message</button>
        </div>
      </div>
    </div>
    
    <!-- Right Sidebar - Members -->
    <div class="members-sidebar">
      <div class="members-header">
        <span>Members — <span id="member-count">0</span></span>
      </div>
      <div class="members-list" id="members-list">
        <div class="loading-container">
          <div class="loader"></div>
          <p>Loading members...</p>
        </div>
      </div>
    </div>
  </div>

  <!-- User Details Modal -->
  <div id="user-modal-overlay" class="user-modal-overlay hidden">
    <div class="user-modal">
      <div class="user-modal-header">
        <button class="user-modal-close" onclick="closeUserModal()">&times;</button>
        <img id="modal-user-avatar" class="user-modal-avatar" src="" alt="Avatar">
        <div class="user-modal-username" id="modal-user-name"></div>
        <div class="user-modal-discriminator" id="modal-user-discriminator"></div>
      </div>
      <div class="user-modal-body">
        <div class="user-info-section">
          <div class="user-info-label">User ID</div>
          <div class="user-info-value" id="modal-user-id"></div>
        </div>
        <div class="user-info-section">
          <div class="user-info-label">Nickname</div>
          <div class="user-info-value" id="modal-user-nick"></div>
        </div>
        <div class="user-info-section">
          <div class="user-info-label">Joined Server</div>
          <div class="user-info-value" id="modal-user-joined"></div>
        </div>
        <div class="user-info-section">
          <div class="user-info-label">Roles (<span id="modal-role-count">0</span>)</div>
          <div class="role-list" id="modal-user-roles"></div>
        </div>
        <div class="user-actions">
          <button class="user-action-btn kick" onclick="kickUser()">Kick User</button>
          <button class="user-action-btn ban" onclick="banUser()">Ban User</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    let currentGuildId = null;
    let currentChannelId = null;
    let messageRefreshInterval = null;
    
    // Super admin check
    const SUPER_ADMIN_IDS = ['926572380409712660', '1355578401494274212'];
    
    // Check authentication
    async function checkAuth() {
      try {
        const response = await fetch('/api/user');
        if (!response.ok) {
          window.location.href = '/';
          return null;
        }
        const user = await response.json();
        if (!SUPER_ADMIN_IDS.includes(user.id)) {
          showNotification('Access denied. Super admin only', 'error');
          window.location.href = '/admin';
          return null;
        }
        return user;
      } catch (error) {
        console.error('Auth check failed:', error);
        window.location.href = '/';
        return null;
      }
    }
    
    async function checkBotStatus() {
      try {
        const response = await fetch('/api/admin/discord/status');
        const status = await response.json();
        console.log('Bot status:', status);
        return status;
      } catch (error) {
        console.error('Failed to check bot status:', error);
        return null;
      }
    }
    
    async function loadGuilds() {
      console.log('Loading guilds...');
      
      // First check bot status
      const status = await checkBotStatus();
      if (!status || !status.is_ready) {
        document.getElementById('guild-name').textContent = 'Bot Not Ready';
        document.getElementById('channel-list').innerHTML = `
          <div style="padding: 2rem; text-align: center; color: var(--accent-warning);">
            <p>Discord bot is not ready yet</p>
            <p style="font-size: 0.9rem; margin-top: 0.5rem;">Please wait a moment...</p>
            <button onclick="location.reload()" style="margin-top: 1rem; padding: 0.5rem 1rem; background: var(--discord-blurple); color: white; border: none; border-radius: 4px; cursor: pointer;">Retry</button>
          </div>
        `;
        return;
      }
      
      try {
        const response = await fetch('/api/admin/discord/guilds');
        console.log('Guilds response status:', response.status);
        const data = await response.json();
        console.log('Guilds data:', data);
        
        if (data.error) {
          console.error('Discord API Error:', data.error);
          document.getElementById('guild-name').textContent = 'Error: ' + data.error;
          document.getElementById('channel-list').innerHTML = `
            <div style="padding: 2rem; text-align: center; color: var(--accent-negative);">
              <p>${data.error}</p>
              <button onclick="location.reload()" style="margin-top: 1rem; padding: 0.5rem 1rem; background: var(--discord-blurple); color: white; border: none; border-radius: 4px; cursor: pointer;">Retry</button>
            </div>
          `;
          return;
        }
        
        if (data.guilds && data.guilds.length > 0) {
          // Use first guild (or you can add guild selector)
          currentGuildId = data.guilds[0].id;
          document.getElementById('guild-name').textContent = data.guilds[0].name;
          loadChannels(currentGuildId);
          loadMembers(currentGuildId);
        } else {
          document.getElementById('guild-name').textContent = 'No guilds found';
          document.getElementById('channel-list').innerHTML = '<div style="padding: 2rem; text-align: center; color: var(--text-secondary);">Bot is not in any Discord servers</div>';
        }
      } catch (error) {
        console.error('Failed to load guilds:', error);
        document.getElementById('guild-name').textContent = 'Connection Error';
        document.getElementById('channel-list').innerHTML = `
          <div style="padding: 2rem; text-align: center; color: var(--accent-negative);">
            <p>Failed to connect to Discord API</p>
            <p style="font-size: 0.9rem; margin-top: 0.5rem;">${error.message}</p>
            <button onclick="location.reload()" style="margin-top: 1rem; padding: 0.5rem 1rem; background: var(--discord-blurple); color: white; border: none; border-radius: 4px; cursor: pointer;">Retry</button>
          </div>
        `;
      }
    }
    
    async function loadChannels(guildId) {
      console.log('Loading channels for guild:', guildId);
      try {
        const response = await fetch(`/api/admin/discord/channels/${guildId}`);
        console.log('Channels response status:', response.status);
        const data = await response.json();
        console.log('Channels data:', data);
        
        const channelList = document.getElementById('channel-list');
        
        if (data.error) {
          channelList.innerHTML = `<div style="padding: 2rem; text-align: center; color: var(--accent-negative);">${data.error}</div>`;
          return;
        }
        
        channelList.innerHTML = '';
        
        if (!data.channels || data.channels.length === 0) {
          channelList.innerHTML = '<div style="padding: 2rem; text-align: center; color: var(--text-secondary);">No channels found</div>';
          return;
        }
        
        // Group by category
        const categories = {};
        data.channels.forEach(channel => {
          const cat = channel.category || 'Uncategorized';
          if (!categories[cat]) categories[cat] = [];
          categories[cat].push(channel);
        });
        
        Object.entries(categories).forEach(([category, channels]) => {
          const catDiv = document.createElement('div');
          catDiv.className = 'channel-category';
          catDiv.textContent = category;
          channelList.appendChild(catDiv);
          
          channels.forEach(channel => {
            if (channel.type === 'TextChannel' || channel.type === 'text') {
              const channelDiv = document.createElement('div');
              channelDiv.className = 'channel-item';
              channelDiv.dataset.channelId = channel.id;
              channelDiv.innerHTML = `
                <svg class="channel-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                <span>${channel.name}</span>
              `;
              channelDiv.addEventListener('click', () => selectChannel(channel.id, channel.name));
              channelList.appendChild(channelDiv);
            }
          });
        });
      } catch (error) {
        console.error('Failed to load channels:', error);
        document.getElementById('channel-list').innerHTML = `<div style="padding: 2rem; text-align: center; color: var(--accent-negative);">Error: ${error.message}</div>`;
      }
    }
    
    function selectChannel(channelId, channelName) {
      currentChannelId = channelId;
      document.getElementById('channel-name').innerHTML = `
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
        ${channelName}
      `;
      
      document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
      document.querySelector(`[data-channel-id="${channelId}"]`).classList.add('active');
      
      document.getElementById('refresh-messages-btn').style.display = 'block';
      document.getElementById('message-input-container').style.display = 'block';
      
      loadMessages(channelId);
      
      // Auto-refresh messages every 5 seconds
      if (messageRefreshInterval) clearInterval(messageRefreshInterval);
      messageRefreshInterval = setInterval(() => loadMessages(channelId), 5000);
    }
    
    async function loadMessages(channelId) {
      try {
        const response = await fetch(`/api/admin/discord/messages/${channelId}?limit=50`);
        const data = await response.json();
        
        const container = document.getElementById('messages-container');
        container.innerHTML = '';
        
        data.messages.reverse().forEach(msg => {
          const msgDiv = document.createElement('div');
          msgDiv.className = 'message';
          const timestamp = new Date(msg.timestamp).toLocaleString();
          const authorColor = msg.author.bot ? 'color: var(--discord-blurple);' : '';
          const botBadge = msg.author.bot ? '<span class="bot-badge">BOT</span>' : '';
          const attachmentsHtml = msg.attachments.length > 0 
            ? '<div style="margin-top: 0.5rem;">' + msg.attachments.map(a => '<a href="' + a.url + '" target="_blank" style="color: var(--discord-blurple);">' + a.filename + '</a>').join(', ') + '</div>'
            : '';
          
          msgDiv.innerHTML = `
            <img src="${msg.author.avatar || 'https://cdn.discordapp.com/embed/avatars/0.png'}" class="message-avatar">
            <div class="message-content">
              <div class="message-header">
                <span class="message-author" style="${authorColor}">${msg.author.name}</span>
                ${botBadge}
                <span class="message-timestamp">${timestamp}</span>
              </div>
              <div class="message-text">${msg.content || '<em>No content</em>'}</div>
              ${attachmentsHtml}
            </div>
          `;
          container.appendChild(msgDiv);
        });
        
        container.scrollTop = container.scrollHeight;
      } catch (error) {
        console.error('Failed to load messages:', error);
      }
    }
    
    let allMembers = [];
    let selectedMember = null;
    
    async function loadMembers(guildId) {
      console.log('Loading members for guild:', guildId);
      try {
        const response = await fetch(`/api/admin/discord/members/${guildId}`);
        console.log('Members response status:', response.status);
        const data = await response.json();
        console.log('Members data:', data);
        
        const membersList = document.getElementById('members-list');
        
        if (data.error) {
          membersList.innerHTML = `<div style="padding: 2rem; text-align: center; color: var(--accent-negative);">${data.error}</div>`;
          document.getElementById('member-count').textContent = '0';
          return;
        }
        
        if (!data.members || data.members.length === 0) {
          membersList.innerHTML = '<div style="padding: 2rem; text-align: center; color: var(--text-secondary);">No members found</div>';
          document.getElementById('member-count').textContent = '0';
          return;
        }
        
        allMembers = data.members;
        document.getElementById('member-count').textContent = data.members.length;
        membersList.innerHTML = '';
        
        data.members.forEach(member => {
          const memberDiv = document.createElement('div');
          memberDiv.className = 'member-item';
          const statusClass = `status-${member.status}`;
          memberDiv.innerHTML = `
            <div class="member-avatar">
              <img src="${member.avatar || 'https://cdn.discordapp.com/embed/avatars/0.png'}" class="member-avatar-img">
              <div class="member-status ${statusClass}"></div>
            </div>
            <span class="member-name">${member.nick || member.name}</span>
          `;
          memberDiv.addEventListener('click', () => showUserModal(member));
          membersList.appendChild(memberDiv);
        });
      } catch (error) {
        console.error('Failed to load members:', error);
        document.getElementById('members-list').innerHTML = `<div style="padding: 2rem; text-align: center; color: var(--accent-negative);">Error: ${error.message}</div>`;
        document.getElementById('member-count').textContent = '0';
      }
    }
    
    function showUserModal(member) {
      selectedMember = member;
      
      document.getElementById('modal-user-avatar').src = member.avatar || 'https://cdn.discordapp.com/embed/avatars/0.png';
      document.getElementById('modal-user-name').textContent = member.name;
      document.getElementById('modal-user-discriminator').textContent = '#' + member.discriminator;
      document.getElementById('modal-user-id').textContent = member.id;
      document.getElementById('modal-user-nick').textContent = member.nick || 'None';
      document.getElementById('modal-user-joined').textContent = member.joined_at ? new Date(member.joined_at).toLocaleString() : 'Unknown';
      
      const rolesContainer = document.getElementById('modal-user-roles');
      document.getElementById('modal-role-count').textContent = member.roles.length;
      
      if (member.roles.length === 0) {
        rolesContainer.innerHTML = '<span style="color: var(--text-secondary);">No roles</span>';
      } else {
        rolesContainer.innerHTML = member.roles.map(role => `
          <div class="role-badge" style="background-color: ${role.color}22; border: 1px solid ${role.color};">
            <div class="role-color" style="background-color: ${role.color};"></div>
            <span style="color: ${role.color};">${role.name}</span>
          </div>
        `).join('');
      }
      
      document.getElementById('user-modal-overlay').classList.remove('hidden');
    }
    
    window.closeUserModal = function() {
      document.getElementById('user-modal-overlay').classList.add('hidden');
      selectedMember = null;
    }
    
    window.kickUser = async function() {
      if (!selectedMember || !currentGuildId) return;
      
      const reason = prompt('Reason for kick:');
      if (!reason) return;
      
      if (!confirm(`Are you sure you want to kick ${selectedMember.name}?`)) return;
      
      try {
        const response = await fetch(`/api/admin/discord/kick/${currentGuildId}/${selectedMember.id}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ reason })
        });
        
        const data = await response.json();
        
        if (response.ok) {
          showNotification('User kicked successfully', 'success');
          closeUserModal();
          loadMembers(currentGuildId);
        } else {
          showNotification('Error: ' + data.error, 'error');
        }
      } catch (error) {
        showNotification('Failed to kick user: ' + error.message, 'error');
      }
    }
    
    window.banUser = async function() {
      if (!selectedMember || !currentGuildId) return;
      
      const reason = prompt('Reason for ban:');
      if (!reason) return;
      
      const deleteDays = confirm('Delete messages from last 7 days?') ? 7 : 0;
      
      if (!confirm(`Are you sure you want to BAN ${selectedMember.name}? This is permanent!`)) return;
      
      try {
        const response = await fetch(`/api/admin/discord/ban/${currentGuildId}/${selectedMember.id}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ reason, delete_message_days: deleteDays })
        });
        
        const data = await response.json();
        
        if (response.ok) {
          showNotification('User banned successfully', 'success');
          closeUserModal();
          loadMembers(currentGuildId);
        } else {
          showNotification('Error: ' + data.error, 'error');
        }
      } catch (error) {
        showNotification('Failed to ban user: ' + error.message, 'error');
      }
    }
    
    // Close modal on overlay click
    document.addEventListener('click', (e) => {
      if (e.target.id === 'user-modal-overlay') {
        closeUserModal();
      }
    });
    
    document.getElementById('send-message-btn').addEventListener('click', async () => {
      const input = document.getElementById('message-input');
      const content = input.value.trim();
      
      if (!content || !currentChannelId) return;
      
      try {
        const response = await fetch('/api/admin/discord/send-message', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ channel_id: currentChannelId, content })
        });
        
        if (response.ok) {
          input.value = '';
          loadMessages(currentChannelId);
        } else {
          showNotification('Failed to send message', 'error');
        }
      } catch (error) {
        console.error('Failed to send message:', error);
        showNotification('Error sending message', 'error');
      }
    });
    
    document.getElementById('refresh-messages-btn').addEventListener('click', () => {
      if (currentChannelId) loadMessages(currentChannelId);
    });
    
    // Enter to send
    document.getElementById('message-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        document.getElementById('send-message-btn').click();
      }
    });
    
    document.addEventListener('DOMContentLoaded', async () => {
      console.log('Discord Panel loaded');
      const user = await checkAuth();
      if (user) {
        console.log('User authenticated:', user.id);
        loadGuilds();
      }
    });
  </script>
</body>
</html>
